[package]
name = "liv-engine"
version = "0.1.0"
edition = "2021"
description = "The Liv engine: an append-only op log and the view derived from it."

[lib]
name = "liv_engine"

# ONE DEPENDENCY, and it is the substrate. `id` and `op` have none and
# should keep none: the on-disk FORMAT is this crate's own bytes
# (design/op-format.md), not a derive macro's output, which is the whole
# of that document's second lesson. SQLite stores those bytes; it does not
# define them.
#
# Proven before it was chosen (core-plan.md phase 1): `bundled` compiles
# SQLite from C and cross-compiles for aarch64-apple-ios and the
# simulator, and FTS5 answers correctly when run inside one.
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# TWO, now — and the second is the one exception the rule above already
# anticipated. A file's identity is a SHA-256 of its bytes: a changed hash
# IS the integration (`files.rs`), so it has to be right, and this tree
# already recorded that call once. `services/Cargo.toml`, beside its own
# copy: "A changed hash is the whole integration, so the digest must be
# vetted, not hand-rolled." The rule above is about the FORMAT not being a
# macro's output; a digest is not a format.
sha2 = "0.10"

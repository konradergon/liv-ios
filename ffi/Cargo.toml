[package]
name = "liv-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "liv_ffi"
# staticlib: the macOS SwiftUI shell links it directly (shell/macos/liv.h).
# cdylib: a shared library for any shell that loads the ABI at runtime.
# rlib: the crate's own Rust tests. All three from the one C ABI — the seam is
# identical for every platform shell.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
liv-core = { path = "../core" }
liv-services = { path = "../services" }
liv-views = { path = "../views" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

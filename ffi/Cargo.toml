[package]
name = "liv-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "liv_ffi"
# staticlib: the iOS shell links it directly (`ffi/liv.h` is its import
# header). cdylib: a shared library for a shell that loads the ABI at
# runtime. rlib: the crate's own Rust tests, and the CLI, which checks the
# box through these same verbs. All three from the one C ABI.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
liv-engine = { path = "../engine" }
liv-surface = { path = "../surface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Test-only: forging a box from a newer build, so the probe's "version"
# answer is tested rather than assumed. It is the one answer a person can
# act on, and lumping it in with the rest strands them.
rusqlite = { version = "0.32", features = ["bundled"] }

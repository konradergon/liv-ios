[package]
name = "liv-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "liv"
path = "src/main.rs"

[dependencies]
# The app's own verbs, through the C ABI's rlib: the CLI checks the box
# through the same code the app reads it with (src/main.rs).
liv-ffi = { path = "../ffi" }
# `history` reads the raw log, which no app verb exposes; and the civil
# arithmetic.
liv-engine = { path = "../engine" }
chrono = "0.4"
serde_json = "1"

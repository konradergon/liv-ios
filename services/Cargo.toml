[package]
name = "lotus-services"
version = "0.1.0"
edition = "2021"

[lib]
name = "lotus_services"

[dependencies]
lotus-core = { path = "../core" }
lotus-views = { path = "../views" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File identity: a byte SHA-256 → FileRef.hash. A changed hash is the whole
# integration, so the digest must be vetted, not hand-rolled.
sha2 = "0.10"
